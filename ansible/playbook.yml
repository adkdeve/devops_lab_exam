---
- name: Configure Web Server Environment
  hosts: webservers
  become: yes  # Run as root/sudo
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Git
      package:
        name: git
        state: present

    - name: Ensure Docker is installed (Example Task)
      package:
        name: docker.io
        state: present