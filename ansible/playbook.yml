---
- name: Configure Web Server Environment
  hosts: webservers
  connection: local
  tasks:
    - name: Ensure Git is installed (Attempt)
      package:
        name: git
        state: present
      ignore_errors: yes  # Prevents failure in Cloud Shell (No sudo)

    - name: Verify Git Installation
      command: git --version
      register: git_version
      changed_when: false

    - name: Check Docker Presence
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Display Versions (Proof of Configuration)
      debug:
        msg: 
          - "Git Version: {{ git_version.stdout }}"
          - "Docker Version: {{ docker_version.stdout }}"