apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer  # This gives us a Public IP
  ports:
  - port: 80
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: your-docker-username/exam-frontend:latest